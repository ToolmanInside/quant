name: Daily paper trading

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Asia/Shanghai"
    - cron: "0 18 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      job_mode:
        description: "任务类型"
        required: true
        default: "daily-close"
        type: choice
        options:
          - daily-close
          - noon-position
      as_of_date:
        description: "任务日期（北京时间，留空表示今天）"
        required: false
        type: string
      force_reinitialize:
        description: "重建模拟账户（配置变更后使用）"
        required: false
        default: false
        type: boolean
      push_wechat:
        description: "推送企业微信"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-paper-trading
  cancel-in-progress: false

jobs:
  update-and-report:
    name: Update, analyze and notify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
      WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
      FEISHU_WEBHOOK_KEYWORD: ${{ secrets.FEISHU_WEBHOOK_KEYWORD }}
      PAPER_AS_OF_DATE: ${{ inputs.as_of_date || '' }}
      PAPER_JOB_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 12 * * *' && 'noon-position' || inputs.job_mode || 'daily-close' }}
      PAPER_FORCE_REINITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reinitialize || false }}
      PAPER_PUSH_WECHAT: ${{ github.event_name != 'workflow_dispatch' || inputs.push_wechat }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      # 行情数据缓存（丢失可重建，7 天过期无风险）
      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: backend/data/cache
          key: quant-market-cache-v1-${{ github.run_id }}
          restore-keys: |
            quant-market-cache-v1-

      # 账户状态已在 Git 中持久化（.quant-state/accounts/*.txt），
      # checkout 即恢复，不再依赖 actions/cache。

      - name: Update data, analyze and push tomorrow's plan
        run: >-
          python scripts/daily_paper_job.py
          --config config/quant-config.json

      # 保存行情数据缓存
      - name: Save market-data cache
        if: ${{ env.PAPER_JOB_MODE == 'daily-close' }}
        uses: actions/cache/save@v4
        with:
          path: backend/data/cache
          key: quant-market-cache-v1-${{ github.run_id }}

      # 将账户状态提交到 Git（日终任务后）；push 前 rebase 防止与手动提交冲突
      - name: Commit account state
        if: ${{ env.PAPER_JOB_MODE == 'daily-close' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .quant-state/accounts/*.txt
          if git diff --cached --quiet; then
            echo "No account state changes to commit."
            exit 0
          fi
          git commit -m "chore: update paper account state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto latest remote..."
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || exit 1
          done
          git push

      - name: Upload daily report and account text backup
        if: ${{ always() && hashFiles('outputs/*.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-report-${{ env.PAPER_JOB_MODE }}-${{ github.run_number }}
          path: |
            outputs/*.md
            .quant-state/accounts/*.txt
          retention-days: 90
